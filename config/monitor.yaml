client:
  name: GaragePark
  own_domain: garagepark.nl
  own_brand: GaragePark
  own_pattern: GaragePark|Garage Park|garagepark\.nl
scrape:
  language_code: nl
  device: mobile
  os: ios
  depth: 20
  max_workers: 12
  queue: standard          # standard = Standard Queue (about $0.65 per run, 5 to 20 min); live = Live endpoints (about $2.15, faster)
  max_queue_minutes: 45    # tasks not ready by then are fetched Live
  engines:
    google_organic: true
    google_ai_mode: true
    chatgpt: false
  prompt_template: Waar kan ik een {keyword} in de omgeving van {city}
# ChatGPT: answers from FolloEngine's weekly measurement, read in place from BigQuery (EU). Each run uses the
# newest FolloEngine date on or before it. The service account needs BigQuery Data Viewer on this table.
chatgpt_source:
  table: folloagency.llm_reporting_tables.garagepark_nl_llm_combined_canonical
  max_age_days: 10
# Local news (tab Lokaal Nieuws): Google Alerts RSS (secret NEWS_ALERT_FEEDS) + DataForSEO Google News.
news:
  enabled: true
  period: m                 # DataForSEO: news of the past month (h, d, w, m, y)
  depth: 20
  max_age_days: 120         # older articles are ignored
  queries:
    markt: ['self storage', 'opslagruimte huren', 'garagebox', 'garageboxen', 'opslagbox', 'bedrijfsunits huren']
    concurrent: ['Shurgard', 'Allsafe opslag', '1BOX opslag', 'Boxie24', 'XL Box opslag', 'Eurobox opslag', 'Storage Share opslag', 'Boxcomplex']
    eigen: ['GaragePark']
  local_query: '(garagebox OR garageboxen OR opslagruimte OR "self storage") {city}'
  extra_brands:             # brands that only matter for news (the AI tabs use `brands`)
    Storage Share: 'storage\s?share'
    Boxcomplex: 'box\s?complex'
    Big Yellow: 'big yellow'
    Storebox: 'storebox'
# Aggregators (tab Aggregators): visits and leads via third party platforms, from GA4 (property garagepark.nl - GA4).
# Sources are matched on sessionSource (case-insensitive regex); the first match names the platform.
aggregators:
  property_id: 280694664
  lead_events: [purchase, appointment_request, viewing_planned, contact_request, brochure_consumer_request]
  sites:
    Huren.nl: 'hurennl|huren\.nl'
    Marktplaats: 'marktplaats'
    Funda: 'funda'
    Opslagmarkt: 'opslagmarkt'
    0m2: '0m2\.nl'
    1Stalling: '1stalling'
    Storage Share: 'storage-?share'
    Opslagzoeker: 'opslagzoeker|thestoragescanner|storeandpark|boxss'
    Trustpilot: 'trustpilot'
    Startpagina & gidsen: 'startpagina|kadaza|cylex|indebuurt|goudengids|telefoongids'
dashboard:
  detail_runs: 2
  history_runs: 26
