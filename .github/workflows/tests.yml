name: Tests

on:
  pull_request:
  push:
    branches: [main]
    paths: ['src/**', 'dashboard/**', 'config/**', 'tests/**', 'requirements.txt']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=src python -m pytest -q tests
